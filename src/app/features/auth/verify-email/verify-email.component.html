<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <div class="mb-7 text-center">
      <span class="mb-2 block text-3xl">✉️</span>
      <h1 class="text-xl font-bold text-gray-900">Verifica tu correo</h1>
      <p class="mt-1 text-sm text-gray-500">
        Enviamos un código de 4 dígitos a la casilla registrada para <strong>{{ username() || 'tu cuenta' }}</strong>.
        Revisa también la carpeta de spam.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col items-center gap-1.5">
        <label class="text-sm font-semibold text-gray-700" for="code">Código de verificación</label>
        <input
          id="code"
          type="text"
          inputmode="numeric"
          maxlength="4"
          placeholder="0000"
          formControlName="code"
          class="w-32 rounded-lg border border-gray-300 px-3 py-2.5 text-center text-2xl font-bold tracking-[0.5em] focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/30"
        />
      </div>

      @if (errorMessage()) {
        <div class="flex items-center gap-2 rounded-lg border border-yellow-200 bg-yellow-50 px-4 py-3 text-sm font-medium text-yellow-800">
          ⚠ {{ errorMessage() }}
        </div>
      }
      @if (infoMessage()) {
        <div class="flex items-center gap-2 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm font-medium text-green-800">
          ✅ {{ infoMessage() }}
        </div>
      }

      <button
        type="submit"
        class="w-full rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="form.invalid || loading()"
      >
        {{ loading() ? 'Verificando…' : 'Verificar correo' }}
      </button>

      <div class="flex items-center justify-between text-sm">
        <button
          type="button"
          class="font-semibold text-red-600 hover:underline disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="resending()"
          (click)="resend()"
        >
          {{ resending() ? 'Reenviando…' : 'Reenviar código' }}
        </button>
        <a routerLink="/login" class="text-gray-500 hover:underline">Volver a iniciar sesión</a>
      </div>
    </form>
  </div>
</div>
