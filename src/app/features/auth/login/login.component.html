<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-10 shadow-sm">
    <div class="mb-7 text-center">
      <span class="mb-2 block text-3xl">🎓</span>
      <h1 class="text-xl font-bold text-gray-900">Attendance App</h1>
      <p class="mt-1 text-sm text-gray-500">Inicia sesión para registrar y gestionar la asistencia</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-gray-700" for="username">Usuario o correo electrónico</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username email"
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/30"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-semibold text-gray-700" for="password">Contraseña</label>
          <a routerLink="/forgot-password" class="text-xs font-semibold text-red-600 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/30"
        />
      </div>

      @if (errorMessage()) {
        <div class="flex items-center gap-2 rounded-lg border border-yellow-200 bg-yellow-50 px-4 py-3 text-sm font-medium text-yellow-800">
          ⚠ {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        class="mt-2 w-full rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="form.invalid || loading()"
      >
        {{ loading() ? 'Iniciando sesión…' : 'Iniciar sesión' }}
      </button>

      <p class="text-center text-sm text-gray-500">
        ¿No tienes cuenta?
        <a routerLink="/register" class="font-semibold text-red-600 hover:underline">Regístrate</a>
      </p>
    </form>
  </div>
</div>
