<div class="min-h-screen bg-gray-50">
  <header class="sticky top-0 z-10 border-b border-gray-200 bg-white/95 backdrop-blur">
    <div class="flex flex-wrap items-center justify-between gap-4 px-4 py-3 sm:px-8 lg:px-12">
      <a routerLink="/teacher/dashboard" class="flex items-center gap-3">
        <span class="text-2xl">🎓</span>
        <div class="flex flex-wrap items-baseline gap-x-3">
          <h1 class="text-lg font-bold text-gray-900">Panel del Docente</h1>
          <span class="text-sm text-gray-500">Bienvenido/a, {{ user()?.firstName }} {{ user()?.lastName }}</span>
        </div>
      </a>

      <div class="flex items-center gap-4">
        <a routerLink="/teacher/profile" title="Profile">
          @if (user()?.photoUrl) {
            <img class="h-9 w-9 rounded-full border border-gray-200 object-cover" [src]="user()!.photoUrl!" alt="Profile photo" />
          } @else {
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-red-100 text-sm font-bold text-red-600">
              {{ initials() }}
            </span>
          }
        </a>
        <span class="hidden rounded-full border border-gray-200 px-3 py-1 text-xs font-semibold text-gray-500 sm:inline-flex">
          Docente
        </span>
        <button
          type="button"
          class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-bold text-gray-900 transition-colors hover:bg-gray-50"
          (click)="confirmingSignOut.set(true)"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H3" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <div class="px-4 py-8 sm:px-8 lg:px-12">
    <router-outlet />
  </div>
</div>

<app-confirm-dialog
  [open]="confirmingSignOut()"
  title="¿Cerrar sesión?"
  message="Tendrás que volver a iniciar sesión para acceder a tu panel."
  confirmLabel="Cerrar sesión"
  (confirmed)="confirmingSignOut.set(false); confirmSignOut()"
  (cancelled)="confirmingSignOut.set(false)"
/>
