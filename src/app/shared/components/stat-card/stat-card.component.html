<div class="flex items-center gap-4 rounded-xl border border-gray-200 bg-white p-7 shadow-sm">
  <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full text-2xl" [class]="iconClasses()">
    {{ icon() }}
  </span>
  <div>
    <div class="text-3xl font-bold leading-tight text-gray-900">{{ value() }}</div>
    <div class="text-sm text-gray-500">{{ label() }}</div>
  </div>
</div>
