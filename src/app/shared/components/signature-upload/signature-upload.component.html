<div>
  @if (!pendingFile()) {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="uploading()"
      (click)="triggerSelect()"
    >
      ✍️ Subir firma
    </button>
  } @else {
    <div class="flex items-center gap-2">
      <img [src]="previewUrl()" alt="Vista previa de la firma" class="h-10 rounded border border-gray-200 bg-white object-contain px-1" />
      <button
        type="button"
        class="inline-flex items-center gap-1.5 rounded-lg bg-red-600 px-3 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="uploading()"
        (click)="confirmUpload()"
      >
        {{ uploading() ? 'Guardando…' : 'Guardar firma' }}
      </button>
      <button
        type="button"
        class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="uploading()"
        (click)="cancelUpload()"
      >
        Cancelar
      </button>
    </div>
  }
  @if (successMessage()) {
    <p class="mt-1 text-xs font-medium text-green-700">{{ successMessage() }}</p>
  }
  @if (errorMessage()) {
    <p class="mt-1 text-xs font-medium text-red-600">{{ errorMessage() }}</p>
  }

  <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />

  <app-image-cropper
    [open]="cropOpen()"
    [imageSrc]="cropSrc()"
    [aspectRatio]="3"
    [rounded]="false"
    [fit]="'contain'"
    title="Ajustar firma"
    (cropped)="onCropped($event)"
    (cancelled)="onCropCancelled()"
  />
</div>
