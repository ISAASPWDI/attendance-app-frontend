<div class="flex items-center gap-4">
  @if (photoUrl()) {
    <img class="h-16 w-16 rounded-full border border-gray-200 object-cover" [src]="photoUrl()!" alt="Profile photo" />
  } @else {
    <span class="flex h-16 w-16 items-center justify-center rounded-full bg-red-100 text-lg font-bold text-red-600">
      {{ initials() }}
    </span>
  }

  <div>
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg border border-red-600 bg-white px-3 py-1.5 text-sm font-semibold text-red-600 transition-colors hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="uploading()"
      (click)="triggerSelect()"
    >
      {{ uploading() ? 'Subiendo…' : 'Cambiar foto' }}
    </button>
    @if (errorMessage()) {
      <p class="mt-1.5 text-xs font-medium text-red-600">{{ errorMessage() }}</p>
    }
  </div>

  <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
</div>
