@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 px-4" (click)="cancelled.emit()">
    <div class="w-full max-w-sm rounded-2xl border border-gray-200 bg-white p-6 shadow-lg" (click)="$event.stopPropagation()">
      <h2 class="text-base font-bold text-gray-900">{{ title() }}</h2>
      <p class="mt-2 text-sm text-gray-600">{{ message() }}</p>
      <div class="mt-5 flex justify-end gap-3">
        <button
          type="button"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50"
          (click)="cancelled.emit()"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-white transition-colors"
          [class]="danger() ? 'bg-red-600 hover:bg-red-700' : 'bg-gray-900 hover:bg-gray-800'"
          (click)="confirmed.emit()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
